version: '3.8'

services:
  kryptodb:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=kryptodb
      - POSTGRES_USER=kryptouser
      - POSTGRES_PASSWORD=kryptopassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webuser -d webeditordb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # network_mode: "host"

volumes:
  postgres_data:
  minio_data:
